name: deploy

on:
  workflow_dispatch:

jobs:

  pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Registry time machine: resolve the packaging toolchain (and the build
      # backend fetched into `python -m build`'s isolated env) as of the 2.4.1
      # release date.
      PIP_INDEX_URL: 'https://:2023-04-16@time-machines-pypi.sealsecurity.io/'

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: 3.9
      - name: Package
        env:
          # `python -m build` builds in an isolated env and re-resolves
          # `[build-system].requires` ("hatchling>=0.21.1") from the index, so the
          # outer pin alone would not reach it. PIP_CONSTRAINT is inherited by that
          # env's pip, forcing the backend that produced the public wheel
          # (WHEEL "Generator: hatchling 1.14.0").
          PIP_CONSTRAINT: ${{ runner.temp }}/build-constraints.txt
        run: |
          echo 'hatchling==1.14.0' > "${{ runner.temp }}/build-constraints.txt"
          pip install --upgrade build 'hatchling==1.14.0'
          python -m build -s -w
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
