name: build

on:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # ubuntu-22.04 is pinned (not ubuntu-latest): actions/setup-python has no
        # CPython 3.7 build in its manifest for ubuntu-24.04, which ubuntu-latest
        # now resolves to, so the py37 leg cannot be provisioned there.
        platform: [ubuntu-22.04, windows-latest]
        tox-env: [py37, py38, py39, py310, py311, nolxml, nohtml5lib]
        # Python patch releases pinned to what shipped at the 2.4.1 release date
        # (2023-04-16): CPython's builtin html.parser changed how it handles
        # <iframe> content in later patch releases, which breaks the
        # parser-behavior iframe tests. Not a code regression.
        include:
          - tox-env: py37
            python-version: 3.7
          - tox-env: py38
            python-version: 3.8
          - tox-env: py39
            # 3.9.13 rather than a 2023-era 3.9.x: CPython 3.9 went source-only
            # after 3.9.13, so it is the newest 3.9 with both a linux-22.04 and a
            # win32 build in the setup-python manifest.
            python-version: '3.9.13'
          - tox-env: py310
            python-version: '3.10.11'
          - tox-env: py311
            python-version: '3.11.3'
          - tox-env: nolxml
            python-version: '3.11.3'
          - tox-env: nohtml5lib
            python-version: '3.10.11'
        # exclude:
        #   - platform: windows-latest
        #     tox-env: py311

    env:
      TOXENV: ${{ matrix.tox-env }}
      # Registry time machine: resolve every pip install (this job's own tooling
      # and, via tox's `passenv = *`, the deps tox installs into each isolated
      # env plus the isolated_build backend) as of the 2.4.1 release date.
      PIP_INDEX_URL: 'https://:2023-04-16@time-machines-pypi.sealsecurity.io/'

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      if: "!endsWith(matrix.python-version, '-dev')"
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up development Python ${{ matrix.python-version }}
      if: endsWith(matrix.python-version, '-dev')
      uses: deadsnakes/action@v2.1.1
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools build tox coverage
    - name: Test
      run: |
        python -m tox
